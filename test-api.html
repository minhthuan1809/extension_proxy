<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test WWProxy API</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
      }
      input,
      button {
        padding: 10px;
        margin: 10px 0;
        width: 100%;
        font-size: 14px;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 4px;
      }
      button:hover {
        background: #0056b3;
      }
      #result {
        margin-top: 20px;
        padding: 15px;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 12px;
      }
      .error {
        color: red;
      }
      .success {
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>🧪 Test WWProxy API</h1>
    <p>Dùng tool này để test API trước khi dùng trong extension</p>

    <label>API Key:</label>
    <input type="text" id="apiKey" placeholder="Nhập API key của bạn..." />

    <button onclick="testAPI()">🔄 Test API</button>

    <div id="result"></div>

    <script>
      async function testAPI() {
        const apiKey = document.getElementById("apiKey").value.trim();
        const resultDiv = document.getElementById("result");

        if (!apiKey) {
          resultDiv.innerHTML =
            '<span class="error">❌ Vui lòng nhập API key!</span>';
          return;
        }

        resultDiv.innerHTML = "⏳ Đang gọi API...";

        try {
          const apiUrl = `https://wwproxy.com/api/client/proxy/available?key=${apiKey}&provinceId=-1`;

          resultDiv.innerHTML += "\n\n📡 URL: " + apiUrl;

          const response = await fetch(apiUrl, {
            method: "GET",
            headers: {
              Accept: "application/json",
            },
            mode: "cors",
          });

          resultDiv.innerHTML +=
            "\n\n📊 Response Status: " +
            response.status +
            " " +
            response.statusText;

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.json();

          resultDiv.innerHTML +=
            '\n\n<span class="success">✅ Success!</span>\n\n';
          resultDiv.innerHTML += JSON.stringify(data, null, 2);
        } catch (error) {
          resultDiv.innerHTML +=
            '\n\n<span class="error">❌ Error: ' + error.message + "</span>";
          resultDiv.innerHTML += "\n\nStack: " + error.stack;
        }
      }

      // Auto-load API key from localStorage
      window.addEventListener("load", () => {
        const savedKey = localStorage.getItem("testApiKey");
        if (savedKey) {
          document.getElementById("apiKey").value = savedKey;
        }

        // Save API key to localStorage
        document.getElementById("apiKey").addEventListener("input", (e) => {
          localStorage.setItem("testApiKey", e.target.value);
        });
      });
    </script>
  </body>
</html>
